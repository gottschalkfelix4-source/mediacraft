# Linting in CI: real bugs (pyflakes, syntax/IO errors, bugbear), not style
target-version = "py312"
line-length = 130

[lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "B008",  # FastAPI: Depends(...) as default argument is the intended pattern
    "B904",  # raise ... from err inside except: nice to have, not a bug
    "E731",  # small lambdas assigned to names are fine
    "E741",  # short variable names like l in comprehensions
]

